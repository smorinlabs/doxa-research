# One weekly routine-update PR across Python (uv) and GitHub Actions.
# The `uv` ecosystem rewrites uv.lock with pyproject.toml. The old `pip`
# ecosystem changed only pyproject pins, so CI (`uv sync --frozen`) never
# tested the new versions.
# Wildcards include all dependency types and major, minor, and patch updates.
#
# Do not set `open-pull-requests-limit` on an entry that joins a
# multi-ecosystem group. With that key present, GitHub kept running the
# previous per-ecosystem config (old group names,
# `multi-ecosystem-update: false` in the updater job definition) and opened
# separate PRs. Every smorinlabs repo with the key showed this; every repo
# without it got one combined PR. One weekly PR needs no limit.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    # Keep dependency bumps in the Dependencies CHANGELOG section.
    # Omit include: scope to avoid the redundant deps(deps) prefix.
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
    # Retain the existing buffer against newly released broken versions.
    cooldown:
      default-days: 3
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 3
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
