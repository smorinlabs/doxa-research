# One weekly routine-update PR across Python and GitHub Actions.
# Wildcards include all dependency types and major, minor, and patch updates.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    # Keep dependency bumps in the Dependencies CHANGELOG section.
    # Omit include: scope to avoid the redundant deps(deps) prefix.
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Retain the existing buffer against newly released broken versions.
    cooldown:
      default-days: 3
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 3
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
