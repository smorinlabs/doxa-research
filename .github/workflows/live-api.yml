---
# P20: weekly real-API workflow regression tests.
#
# Runs `pytest -m "live_api and not extended_slow"` against live OpenAI, Perplexity, and Gemini to
# detect drift in user-visible CLI behaviors (streaming, file output,
# append, no-metadata, secret masking, mismatch defense, provider-specific
# passthrough). Sibling to
# extended.yml (which checks model-kind contracts nightly).
#
# Gated on OPENAI_API_KEY, PERPLEXITY_API_KEY, and GEMINI_API_KEY being set
# as repo secrets. The job is informational — failures notify the team but
# do NOT block PR merges.
#
# Security note: this workflow does not use any github.event.* untrusted
# inputs in run: commands; provider secrets are passed via env.

name: Live-API Workflow Tests (weekly)

"on":
  schedule:
    - cron: "0 2 * * 0"   # Sunday 02:00 UTC = Saturday 7pm PDT (6pm PST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api
  # Don't cancel an in-flight weekly — same reasoning as extended.yml.
  cancel-in-progress: false

jobs:
  live_api:
    name: pytest -m "live_api and not extended_slow"
    runs-on: ubuntu-latest
    # Only run live-provider scheduled/manual jobs in the canonical repo.
    # Forks do not receive upstream secrets, and these tests can spend
    # provider quota.
    if: github.repository == 'smorinlabs/doxa-research'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      # Split gate: a missing secret reds the workflow conclusion (this
      # step has no continue-on-error), so scheduled-failure email fires.
      # A flaky provider during the pytest run below stays informational
      # (continue-on-error: true on that step) so transient API outages
      # don't page the team.
      - name: Verify provider secrets present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::OPENAI_API_KEY missing"; missing=1; }
          [ -n "$PERPLEXITY_API_KEY" ] || { echo "::error::PERPLEXITY_API_KEY missing"; missing=1; }
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY missing"; missing=1; }
          exit "$missing"
      - name: Run live-API workflow tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Defense in depth: even if a key is set but empty in a way the
          # pre-flight shell test misses, LIVE_API_STRICT=1 makes
          # require_*_key() helpers pytest.fail instead of pytest.skip.
          # See tests/extended/conftest.py::_require_key.
          LIVE_API_STRICT: "1"
        run: uv run pytest -m "live_api and not extended_slow" -v
        continue-on-error: true
