---
# lefthook.yml — Git hooks configuration
# Docs: https://github.com/evilmartians/lefthook
# Install: brew install lefthook && lefthook install

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    editorconfig:
      run: uvx --from 'editorconfig-checker==3.6.1' ec {staged_files}

    # Glob excludes md/txt: prose authors shouldn't have trailing
    # whitespace silently rewritten under them. Source files (yml, sh,
    # json, toml, cfg, conf, ini) still get the auto-fix.
    trailing-whitespace:
      glob: "*.{yml,yaml,sh,json,toml,cfg,conf,ini}"
      run: |
        for f in {staged_files}; do
          if [ -f "$f" ]; then
            sed -i.bak 's/[[:space:]]*$//' "$f" && rm -f "$f.bak"
          fi
        done
      stage_fixed: true

    end-of-file-fixer:
      glob: "*.{yml,yaml,sh,json,toml,cfg,conf,ini}"
      run: |
        for f in {staged_files}; do
          if [ -f "$f" ] && [ -s "$f" ]; then
            tail -c1 "$f" | read -r _ || echo "" >> "$f"
          fi
        done
      stage_fixed: true

    check-added-large-files:
      run: |
        max_kb=500
        for f in {staged_files}; do
          if [ -f "$f" ]; then
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -gt $((max_kb * 1024)) ]; then
              echo "File $f is too large ($(( size / 1024 )) KB > ${max_kb} KB)"
              exit 1
            fi
          fi
        done

    check-yaml:
      glob: "*.{yml,yaml}"
      run: uvx yamllint -c .yamllint {staged_files}

    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    ruff-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    ty-typecheck:
      glob: "*.py"
      run: uv run ty check {staged_files}

    gitleaks:
      run: ./scripts/check-gitleaks.sh staged

    # Config (skip + ignore-words-list) lives in pyproject.toml under
    # [tool.codespell] so lefthook + CI pick up the same list. Don't
    # duplicate flags here.
    codespell:
      glob: "*.{py,md}"
      run: uvx codespell {staged_files}

    test:
      glob: "*.py"
      run: ./doxa_test -r --provider mock --skip-interactive

    validate-starter-template:
      glob: "src/doxa_research/data/starter.config.toml"
      run: uv run doxa config validate src/doxa_research/data/starter.config.toml

pre-push:
  parallel: true
  commands:
    ty-typecheck:
      run: uv run ty check src/

    bandit-security:
      run: uvx bandit -r src/doxa_research/ -ll -q

    gitleaks:
      run: ./scripts/check-gitleaks.sh full

    # Mirror CI's Hygiene job: codespell + yamllint over the WHOLE repo
    # at push time, not just staged files. Catches typos / YAML issues
    # introduced in commits where the affected file is not staged again
    # later (and survives LEFTHOOK=0 WIP commits that bypass pre-commit).
    # codespell config is shared via pyproject.toml [tool.codespell];
    # yamllint config is .yamllint. Both files are also consumed by
    # .github/workflows/ci.yml's Hygiene job.
    codespell-full:
      run: uvx codespell .

    yamllint-full:
      run: uvx yamllint -c .yamllint .

    # Full-tree editorconfig scan. The pre-commit `editorconfig` step only
    # sees {staged_files}, so violations introduced by GitHub UI edits,
    # LEFTHOOK=0 WIP commits, or PR-merge artifacts can reach main and
    # cascade into every subsequent CI run. This mirrors ci.yml's Hygiene
    # job. Markdown is excluded via .editorconfig-checker.json (Exclude list).
    editorconfig-full:
      run: uvx --from 'editorconfig-checker==3.6.1' ec
